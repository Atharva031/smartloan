apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartloan-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartloan
  template:
    metadata:
      labels:
        app: smartloan
    spec:
      containers:
        - name: smartloan
          image: smartloan-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: smartloan-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smartloan-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartloan-secret
                  key: postgres-password
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: smartloan-config
                  key: JAVA_TOOL_OPTIONS
---
apiVersion: v1
kind: Service
metadata:
  name: smartloan-service
spec:
  type: NodePort
  selector:
    app: smartloan
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080